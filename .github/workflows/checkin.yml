name: AIvalux 自动签到

on:
  schedule:
    # 每天北京时间早上8点执行 (UTC时间0点)
   - cron: '0 0-1 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 执行签到
      env:
        AIVALUX_EMAIL: ${{ secrets.AIVALUX_EMAIL }}
        AIVALUX_PASSWORD: ${{ secrets.AIVALUX_PASSWORD }}
      run: |
        python checkin.py

    - name: 签到结果通知
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ 签到成功"
        else
          echo "❌ 签到失败"
        fi
